x-api-common: &api-common
  image: tp3-globallogistics-api:local
  build:
    context: ./service
    dockerfile: Dockerfile
  expose:
    - "3000"
  environment: &api-environment
    PORT: "3000"
  networks:
    - backend
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  api1:
    <<: *api-common
    hostname: api1
    environment:
      <<: *api-environment
      INSTANCE_ID: api1

  api2:
    <<: *api-common
    hostname: api2
    environment:
      <<: *api-environment
      INSTANCE_ID: api2

  api3:
    <<: *api-common
    hostname: api3
    environment:
      <<: *api-environment
      INSTANCE_ID: api3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
