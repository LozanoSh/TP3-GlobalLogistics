# Balanceador de carga TP3 GlobalLogistics.
# Entrada única: localhost:8080 (host) -> nginx:80 -> api1|api2|api3:3000.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Formato de log con el upstream que atendió y sus tiempos, útil para
    # verificar el balanceo y para el análisis de latencia de Rivamar.
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr up_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout balanceo;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # DNS interno de Docker. Con `resolve` en cada server, Nginx vuelve a
    # resolver api1/api2/api3 si un contenedor se recrea y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        # Round-robin (algoritmo por defecto de Nginx), mismo peso para las tres.
        zone api_backend 64k;

        # Detección pasiva de fallos: tras 2 errores en 10 s la réplica se
        # excluye durante 10 s y luego se vuelve a probar con tráfico real.
        server api1:3000 resolve max_fails=2 fail_timeout=10s;
        server api2:3000 resolve max_fails=2 fail_timeout=10s;
        server api3:3000 resolve max_fails=2 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Cabeceras comunes del proxy, sin caché (las APIs ya envían
        # Cache-Control: no-store).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Upstream $upstream_addr always;

        # Timeouts: conexión corta para detectar rápido una réplica caída.
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;

        # Reintento en otra réplica cuando la elegida falla. Las rutas son GET
        # (idempotentes), así que reenviarlas es seguro.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        location = /health {
            proxy_read_timeout 3s;
            proxy_pass http://api_backend;
        }

        location /api/cpu {
            # Sin reintento por timeout: repetir un cálculo lento en otra
            # réplica duplicaría la carga durante las pruebas de saturación.
            proxy_next_upstream error http_502 http_503 http_504;
            proxy_read_timeout 30s;
            proxy_pass http://api_backend;
        }

        location /api/ {
            proxy_pass http://api_backend;
        }

        location = /envios/validar {
            # No repetir POST si una réplica falla después de recibir el body.
            proxy_next_upstream off;
            proxy_pass http://api_backend;
        }

        # Estado propio del balanceador, sin pasar por las APIs.
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"estado":"ok","componente":"nginx"}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":"Ruta no encontrada"}';
        }
    }
}
